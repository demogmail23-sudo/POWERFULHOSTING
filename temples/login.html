<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - ZAINU HOST PRO</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #6366f1;
            --secondary: #06b6d4;
            --dark: #0f172a;
            --darker: #020617;
            --card: #1e293b;
        }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: linear-gradient(135deg, var(--darker) 0%, var(--dark) 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        .login-card {
            background: var(--card);
            border-radius: 32px;
            padding: 2.5rem;
            width: 100%;
            max-width: 450px;
            border: 1px solid rgba(99, 102, 241, 0.3);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .logo {
            text-align: center;
            font-size: 2rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 0.5rem;
        }

        .subtitle {
            text-align: center;
            color: #94a3b8;
            font-size: 0.85rem;
            margin-bottom: 2rem;
        }

        .input-group {
            margin-bottom: 1.2rem;
        }

        .input-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: #94a3b8;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .input-group input {
            width: 100%;
            padding: 0.9rem 1rem;
            background: var(--darker);
            border: 1px solid rgba(99, 102, 241, 0.3);
            border-radius: 14px;
            color: white;
            font-size: 1rem;
            transition: all 0.3s;
        }

        .input-group input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.2);
        }

        .checkbox {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            margin: 1.2rem 0;
            cursor: pointer;
        }

        .checkbox input {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: var(--primary);
        }

        .checkbox label {
            color: #94a3b8;
            cursor: pointer;
        }

        button {
            width: 100%;
            padding: 0.9rem;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border: none;
            border-radius: 14px;
            color: white;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(99, 102, 241, 0.3);
        }

        .register-link {
            text-align: center;
            margin-top: 1.5rem;
            color: #94a3b8;
        }

        .register-link a {
            color: var(--primary);
            text-decoration: none;
        }

        .message {
            padding: 0.8rem;
            border-radius: 12px;
            margin-top: 1rem;
            display: none;
        }

        .error {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid #ef4444;
            color: #f87171;
        }

        .success {
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid #10b981;
            color: #34d399;
        }

        .admin-hint {
            background: rgba(99, 102, 241, 0.1);
            border: 1px solid var(--primary);
            border-radius: 12px;
            padding: 0.8rem;
            margin-bottom: 1.5rem;
            text-align: center;
            display: none;
        }

        @media (max-width: 480px) {
            .login-card { padding: 1.5rem; }
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="logo">🚀 ZAINU HOST <span style="font-size:0.8rem">PRO</span></div>
        <div class="subtitle">Ultimate Hosting Platform</div>

        <div class="admin-hint" id="adminHint">
            👑 Admin Login: zainu121
        </div>

        <div class="input-group">
            <label>👤 Username or Email</label>
            <input type="text" id="username" placeholder="Enter username or email">
        </div>

        <div class="input-group">
            <label>🔒 Password</label>
            <input type="password" id="password" placeholder="Enter password">
        </div>

        <div class="checkbox">
            <input type="checkbox" id="rememberMe">
            <label>Remember me (Stay logged in for 1 year)</label>
        </div>

        <button onclick="handleLogin()">✨ Access Dashboard ✨</button>

        <div class="register-link">
            Don't have an account? <a href="#" onclick="showRegister()">Register here</a>
        </div>

        <div id="message" class="message"></div>
    </div>

    <script>
        // Show admin hint
        document.getElementById('username').addEventListener('input', function(e) {
            const hint = document.getElementById('adminHint');
            if (e.target.value.toLowerCase() === 'zainu121') {
                hint.style.display = 'block';
            } else {
                hint.style.display = 'none';
            }
        });

        // Enter key support
        document.getElementById('password').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') handleLogin();
        });

        async function handleLogin() {
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const rememberMe = document.getElementById('rememberMe').checked;

            if (!username || !password) {
                showMessage('Please enter username and password', 'error');
                return;
            }

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password, remember_me: rememberMe })
                });
                const data = await res.json();

                if (data.success) {
                    showMessage('Login successful! Redirecting...', 'success');
                    setTimeout(() => window.location.href = '/', 500);
                } else {
                    showMessage(data.message, 'error');
                }
            } catch(e) {
                showMessage('Network error. Please try again.', 'error');
            }
        }

        function showRegister() {
            const html = `
                <div style="margin-top:1rem">
                    <div class="input-group"><label>👤 Username</label><input type="text" id="regUsername" placeholder="3-30 chars"></div>
                    <div class="input-group"><label>📧 Email (Optional)</label><input type="email" id="regEmail" placeholder="your@email.com"></div>
                    <div class="input-group"><label>🔒 Password</label><input type="password" id="regPassword" placeholder="Min 6 chars"></div>
                    <div class="input-group"><label>✓ Confirm Password</label><input type="password" id="regConfirm" placeholder="Confirm password"></div>
                    <div class="input-group"><label>🎁 Referral Code (Optional)</label><input type="text" id="referralCode" placeholder="Enter referral code"></div>
                    <button onclick="register()">🚀 Create Account</button>
                    <button onclick="location.reload()" style="margin-top:0.5rem; background:transparent; border:1px solid var(--primary)">← Back to Login</button>
                </div>
            `;
            document.querySelector('.login-card').innerHTML = html;
        }

        async function register() {
            const username = document.getElementById('regUsername').value.trim();
            const email = document.getElementById('regEmail').value.trim();
            const password = document.getElementById('regPassword').value;
            const confirm = document.getElementById('regConfirm').value;
            const referral = document.getElementById('referralCode').value.trim();

            if (!username || !password) {
                alert('Username and password required');
                return;
            }
            if (password !== confirm) {
                alert('Passwords do not match');
                return;
            }
            if (password.length < 6) {
                alert('Password must be at least 6 characters');
                return;
            }

            const res = await fetch('/api/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, email, password, referral_code: referral })
            });
            const data = await res.json();

            if (data.success) {
                alert('Registration successful! Please login.');
                location.reload();
            } else {
                alert(data.message);
            }
        }

        function showMessage(msg, type) {
            const msgDiv = document.getElementById('message');
            msgDiv.textContent = msg;
            msgDiv.className = `message ${type}`;
            msgDiv.style.display = 'block';
            setTimeout(() => msgDiv.style.display = 'none', 4000);
        }

        // Check if already logged in
        async function checkSession() {
            try {
                const res = await fetch('/api/current_user');
                const data = await res.json();
                if (data.success) window.location.href = '/';
            } catch(e) {}
        }
        checkSession();
    </script>
</body>
</html>
